# references:
# https://trstringer.com/github-actions-multiline-strings/
# https://trstringer.com/github-actions-create-release-upload-artifacts/
# https://github.com/Speedy37/sws/blob/444c67157a98652c4e7ffd3b6d6bbfb664071926/.github/workflows/msbuild.yml
# https://stackoverflow.com/questions/58886293/getting-current-branch-and-commit-hash-in-github-action

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit'
        required: true
      config:
        description: 'Configuration'
        required: false

env:
  BUILD_CONFIGURATION: ${{ github.event.inputs.config || 'Release' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - name: Print inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "ref: ${GITHUB_EVENT_INPUTS_REF}"
          echo "config: ${GITHUB_EVENT_INPUTS_CONFIG}"
        env:
          GITHUB_EVENT_INPUTS_REF: ${{ github.event.inputs.ref }}
          GITHUB_EVENT_INPUTS_CONFIG: ${{ github.event.inputs.config }}

      - name: Checkout latest build and submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: github.event.inputs.ref == ''
        with:
          submodules: recursive
          persist-credentials: false

      - name: Checkout specific build and submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: github.event.inputs.ref != ''
        with:
          ref: ${{ github.event.inputs.ref }}
          submodules: recursive
          persist-credentials: false

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Declare some variables
        id: vars
        shell: bash
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "ref_slug=${GITHUB_REF_NAME//\//-}" >> $GITHUB_OUTPUT

      - name: Enable SimpleWindowSwitcher support for newer Windows SDKs
        shell: cmd
        run: |
          cd libs/sws
          C:\msys64\usr\bin\wget.exe https://github.com/valinet/sws/commit/972acb76d1e6429133c92ed7cdefd29b9a2c6179.patch
          C:\msys64\usr\bin\dos2unix.exe 972acb76d1e6429133c92ed7cdefd29b9a2c6179.patch
          C:\msys64\usr\bin\dos2unix.exe SimpleWindowSwitcher/sws_def.h
          C:\msys64\usr\bin\patch.exe -N SimpleWindowSwitcher/sws_def.h 972acb76d1e6429133c92ed7cdefd29b9a2c6179.patch
          C:\msys64\usr\bin\unix2dos.exe SimpleWindowSwitcher/sws_def.h
          exit /b 0

      - name: Setup NuGet
        uses: nuget/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0
        with:
          nuget-version: '7.x'

      - name: Restore NuGet packages
        run: |
          nuget restore ExplorerPatcher.sln
          nuget restore ep_starttiledata/ep_starttiledata.slnx

      - name: Build dependencies (Debug)
        if: env.BUILD_CONFIGURATION == 'Debug'
        shell: cmd
        run: BuildDependenciesDebug.bat

      - name: Build dependencies (Release)
        if: env.BUILD_CONFIGURATION == 'Release'
        shell: cmd
        run: BuildDependenciesRelease.bat

      - name: Download ep_taskbar
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          repository: ExplorerPatcher/ep_taskbar_releases
          fileName: ep_taskbar.*.dll
          latest: true
          out-file-path: build/Release

      # build/Release/ep_taskbar.*.amd64.dll -> build/Release/x64/ep_taskbar.*.dll
      - name: Move ep_taskbar
        shell: bash
        run: |
          if ls build/Release/ep_taskbar.*.amd64.dll 1> /dev/null 2>&1; then
            mkdir -p build/Release/x64
            for file in build/Release/ep_taskbar.*.amd64.dll; do
              mv "$file" "build/Release/x64/$(basename "$file" .amd64.dll).dll"
            done
          fi

          rm -f build/Release/ep_taskbar.*.arm64.dll

      - name: Build ExplorerPatcher
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: |
          msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} build.proj

      - name: Generate dxgi.dll
        shell: bash
        run: |
          if [[ -f "build/Release/x64/ExplorerPatcher.amd64.dll" ]]; then cp build/Release/x64/ExplorerPatcher.amd64.dll build/Release/x64/dxgi.dll; fi

      - name: Patch amd64 setup
        shell: cmd
        run: |
          if exist "build\Release\x64\ExplorerPatcher.amd64.dll" (
            "build\Release\x64\ep_setup_patch.exe" "build\Release\x64\ExplorerPatcher.amd64.dll" "build\Release\x64\ep_setup.exe"
          )
          exit /b 0

      - name: Delete intermediate files
        shell: bash
        run: |
          rm -rf build/Release/x64/ep_setup_files
          rm -f build/Release/x64/ep_setup_files.zip.bin

      - name: Upload artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ep_bin_multi_${{ steps.vars.outputs.sha_short }}_${{ steps.vars.outputs.ref_slug }}
          path: |
            build/Release/
          if-no-files-found: error

      # ExplorerPatcher++ smoke test: install the freshly built setup on the runner, start Explorer,
      # open the Properties window on the "Essential Tweaks" page and take screenshots.
      - name: Smoke test (install, open Properties, screenshots)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 10
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Take-Screenshot($name) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path (Resolve-Path smoke) "$name.png"), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            "Saved smoke\$name.png ($($b.Width)x$($b.Height))"
          }
          function List-Windows($title) {
            "--- windows ($title) ---"
            Get-Process | Where-Object { $_.MainWindowTitle } | Select-Object ProcessName, Id, MainWindowTitle | Format-Table -AutoSize | Out-String -Width 200
          }
          "User: $(whoami)"
          whoami /groups | Select-String 'Mandatory'
          $v = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          "OS: $($v.ProductName) $($v.DisplayVersion) build $($v.CurrentBuild).$($v.UBR)"
          "Session: $((Get-Process -Id $PID).SessionId)"
          Get-Process explorer -ErrorAction SilentlyContinue | Select-Object Id, SessionId | Out-String

          # Pre-seed settings: open Properties on the Essential Tweaks page (10th page) with the new tweaks enabled
          New-Item -Path 'HKCU:\Software\ExplorerPatcher' -Force | Out-Null
          $reg = 'HKCU:\Software\ExplorerPatcher'
          Set-ItemProperty -Path $reg -Name 'LastSectionInProperties' -Value 10 -Type DWord
          Set-ItemProperty -Path $reg -Name 'EssentialTaskbarVolumeScroll' -Value 1 -Type DWord
          Set-ItemProperty -Path $reg -Name 'EssentialVolumeStep' -Value 4 -Type DWord
          Set-ItemProperty -Path $reg -Name 'EssentialTrayIconFix' -Value 5 -Type DWord
          Set-ItemProperty -Path $reg -Name 'EssentialDisableExtensionWarning' -Value 1 -Type DWord
          Set-ItemProperty -Path $reg -Name 'EssentialExplorerDoubleClickUp' -Value 1 -Type DWord
          Set-ItemProperty -Path $reg -Name 'EssentialReopenClosedTab' -Value 1 -Type DWord

          Take-Screenshot 'step0_before_install'

          $setup = (Resolve-Path 'build\Release\x64\ep_setup.exe').Path
          "Installing $setup"
          $p = Start-Process -FilePath $setup -PassThru
          if (-not $p.WaitForExit(240000)) { "ep_setup did not exit in time"; Take-Screenshot 'step1_setup_hung'; Stop-Process -Id $p.Id -Force }
          else { "ep_setup exit code: $($p.ExitCode)" }
          "dxgi.dll present: $(Test-Path "$env:windir\dxgi.dll")"
          Get-ChildItem "$env:ProgramFiles\ExplorerPatcher" -ErrorAction SilentlyContinue | Select-Object Name, Length | Out-String

          if (-not (Get-Process explorer -ErrorAction SilentlyContinue)) { "Starting explorer.exe"; Start-Process explorer.exe }
          Start-Sleep -Seconds 75
          Get-Process explorer -ErrorAction SilentlyContinue | Select-Object Id, StartTime | Out-String
          List-Windows 'after explorer start'
          Take-Screenshot 'step2_desktop_after_install'

          "Opening Properties"
          Start-Process rundll32.exe -ArgumentList "`"$env:ProgramFiles\ExplorerPatcher\ep_gui.dll`",ZZGUI"
          Start-Sleep -Seconds 25
          List-Windows 'after properties'
          Take-Screenshot 'step3_properties'

          "Opening a File Explorer window"
          Start-Process explorer.exe -ArgumentList "$env:SystemDrive\"
          Start-Sleep -Seconds 15
          List-Windows 'after file explorer'
          Take-Screenshot 'step4_file_explorer'

          "--- explorer crash events (last 15 minutes) ---"
          Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001,1026; StartTime=(Get-Date).AddMinutes(-15)} -ErrorAction SilentlyContinue |
            Select-Object -First 10 TimeCreated, Id, ProviderName, Message | Format-List | Out-String -Width 300

      - name: Upload smoke test screenshots
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke_test_${{ steps.vars.outputs.sha_short }}
          path: smoke/
          if-no-files-found: warn

      # build/Release/x64/ep_setup.exe -> build/Release/ep_setup.exe
      - name: Stage files for release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: |
          if [ -d "build/Release/x64" ] && ls build/Release/x64/ep_setup.exe 1> /dev/null 2>&1; then
            cp build/Release/x64/ep_setup.exe build/Release/ep_setup.exe
          fi

      - name: Generate release name
        shell: bash
        working-directory: build/Release/x64
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          echo "data=$(./ep_generate_release_name.exe)" >> $GITHUB_OUTPUT
        id: release_name

      - name: Generate release notes
        shell: bash
        working-directory: build/Release/x64
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          echo "data<<EP_RELEASE_DESCRIPTION_DELIM" >> $GITHUB_OUTPUT
          echo "$(./ep_generate_release_description.exe ${STEPS_VARS_OUTPUTS_SHA_SHORT} ${{ github.ref_type }} ${{ github.ref_name }} ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_OUTPUT
          echo "EP_RELEASE_DESCRIPTION_DELIM" >> $GITHUB_OUTPUT
        id: release_description
        env:
          STEPS_VARS_OUTPUTS_SHA_SHORT: ${{ steps.vars.outputs.sha_short }}

      - name: Create/update release (valinet)
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        if: github.repository_owner == 'valinet' && github.event_name == 'push' && github.ref_type == 'tag'
        id: create_release
        with:
          draft: false
          prerelease: ${{ !startsWith(github.event.head_commit.message, 'rel_') }}
          name: ${{ steps.release_name.outputs.data }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.release_description.outputs.data }}
          files: |
            build/Release/ep_setup.exe
          token: ${{ secrets.PAT }}

      - name: Create/update release (forks)
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        if: github.repository_owner != 'valinet' && github.event_name == 'push' && github.ref_type == 'tag'
        id: create_release_fork
        with:
          draft: false
          prerelease: ${{ !startsWith(github.event.head_commit.message, 'rel_') }}
          name: ${{ steps.release_name.outputs.data }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.release_description.outputs.data }}
          files: |
            build/Release/ep_setup.exe
          token: ${{ secrets.GITHUB_TOKEN }}
